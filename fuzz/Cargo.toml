[package]
name = "vault-fuzz"
version = "0.0.0"
edition = "2024"
license = "GPL-3.0-or-later"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
base64 = "0.23.1"
libfuzzer-sys = "0.4"
serde_json = "1.0"
vault-browser = { path = "../crates/browser" }
vault-core = { path = "../crates/core" }
vault-import = { path = "../crates/import" }
vault-platform = { path = "../crates/platform" }
vault-sync-wire = { path = "../crates/sync-wire" }

[[bin]]
name = "vault_file"
path = "fuzz_targets/vault_file.rs"
