# CodeQL's configuration (read by .github/workflows/codeql.yml). Test code and the
# screenshot/demo examples are left out: they hold made-up passwords, keys and patterns on
# purpose (the same paths .gitleaks.toml and .github/secret_scanning.yml allow). The
# #[cfg(test)] modules inside src/ are left out by the Rust extractor itself (cfg `test`
# turned off in .github/workflows/codeql.yml); everything else under src/ is analysed.
name: Password vault

paths-ignore:
  # Integration tests and what they read (committed test vaults, test keys).
  - "**/tests/**"
  - "crates/core/testdata/**"
  # Test modules in a file of their own: the apps' headless tests, and any
  # `#[cfg(test)] mod tests;` moved out of a source file.
  - "**/tests.rs"
  # The extension's tests (deliberately catastrophic regexes among them).
  - "apps/extension/test/**"
  # The screenshot tools and the demo vault: made-up data, never shipped.
  - "apps/desktop/examples/**"
  - "apps/mobile/examples/**"
  # The fuzz targets: they feed made-up bytes and a fixed test password to the readers.
  - "fuzz/**"
