# GitHub secret scanning: paths that hold only material made for tests (see .gitleaks.toml,
# which allows the same). A real secret never belongs anywhere in the repository.
paths-ignore:
  - "crates/core/tests/fixtures/**"
  - "crates/core/testdata/**"
  - "**/tests/**"
  - "**/tests.rs"
  - "apps/extension/test/**"
