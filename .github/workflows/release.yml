# Releases. Every push to main that changes an app builds all of them from that commit:
#  - the phone app's APK, signed with the release key when the run publishes (else with a key
#    made for that run, so the build is still tried end to end);
#  - the desktop app for Windows (vault-desktop.exe, one file: it is also the browser
#    extension's native host) and the `vault` command;
#  - the sync server for Linux (x64, arm64) and Windows;
#  - the browser extension, as a zip to load unpacked.
# Each run keeps them as artifacts, with a provenance attestation for every file. When the
# version they carry has no release yet, the run publishes the GitHub release v<version>
# (marked the latest; its notes are that version's section of CHANGELOG.md) and the server's
# image, ghcr.io/<owner>/vault-server, for amd64 and arm64. The release holds manifest.json,
# which lists every file's name, size and SHA-256, the commit and the APK's certificate, and
# manifest.json.minisig, its signature with the manifest key (minisign's format,
# tools/release): the apps take a release only with that signature, by one of the keys they
# carry (vault_sync_wire::releases::RELEASE_KEYS). To release: bump the version in
# apps/mobile/Cargo.toml, apps/mobile-android/Cargo.toml, apps/desktop/Cargo.toml,
# apps/cli/Cargo.toml, apps/server/Cargo.toml and apps/extension/manifest.json (the run refuses
# them unequal), add the phone's notes (apps/mobile/ui/app.slint) and the CHANGELOG.md section,
# push to main. The phones and the desktop app find it by themselves within the hour.
#
# The signing keys live only in the secrets of the `android-release` environment, which GitHub
# hands to jobs running for main alone (the environment's branch policy), and only once the
# maintainer approved that run (its required reviewer, admins included): a pull request, a run
# from another branch, or a push alone never sees them. Only a run that publishes asks for them.
#   ANDROID_SIGNING_STORE      the APK's key (release.p12: PKCS#12, alias "vault"), in base64
#   ANDROID_SIGNING_PASSWORD   its password
#   RELEASE_MANIFEST_KEY       the manifest key (tools/release/make-manifest-keys.ps1), in base64
#   RELEASE_MANIFEST_PASSWORD  its password
# Two jobs get them, each after its own approval: the APK's job and the manifest's. The APK must
# come out signed with the certificate named below, and the manifest with a key the apps carry,
# or nothing is published: a key swapped in the secrets can't sign a release.
# `gh attestation verify <file> --repo <repo>` says a file was built here, and from which commit.
name: Release

on:
  push:
    branches: [main]
    paths:
      - "apps/cli/**"
      - "apps/desktop/**"
      - "apps/extension/**"
      - "apps/mobile/**"
      - "apps/mobile-android/**"
      - "apps/server/**"
      - "crates/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - "CHANGELOG.md"
      - "tools/release/**"
      - ".github/workflows/release.yml"
  workflow_dispatch:

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  # As in apps/mobile-android/build.ps1. Skia comes built with this NDK's compiler, so the C++
  # library linked with it has to be at least as new (check-library.ps1 says so before signing).
  NDK_VERSION: 30.0.16248370
  BUILD_TOOLS: 36.0.0
  # SHA-256 of the release certificate, as make-release-key.ps1 printed it (docs/MOBILE.md).
  RELEASE_CERTIFICATE: 5b8f1f7929a87c7bdd1a0b5b0e188fa16d0b06926f230f6ade0f85a5c9b1e971

jobs:
  version:
    name: Version
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      publish: ${{ steps.version.outputs.publish }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: The same version everywhere
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          crate_version() { sed -n 's/^version = "\([0-9]*\.[0-9]*\.[0-9]*\)"\r\?$/\1/p' "$1" | head -n 1; }
          version=$(crate_version apps/mobile-android/Cargo.toml)
          if [ -z "$version" ]; then
            echo "::error file=apps/mobile-android/Cargo.toml::No version"
            exit 1
          fi
          for file in apps/mobile/Cargo.toml apps/desktop/Cargo.toml apps/cli/Cargo.toml apps/server/Cargo.toml; do
            if [ "$(crate_version "$file")" != "$version" ]; then
              echo "::error file=$file::Its version is not $version, as in apps/mobile-android/Cargo.toml"
              exit 1
            fi
          done
          if [ "$(jq -r .version apps/extension/manifest.json)" != "$version" ]; then
            echo "::error file=apps/extension/manifest.json::Its version is not $version"
            exit 1
          fi
          tag="v$version"
          publish=false
          if [ "$GITHUB_REF" = refs/heads/main ] && ! gh release view "$tag" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            publish=true
          fi
          {
            echo "version=$version"
            echo "tag=$tag"
            echo "publish=$publish"
          } >> "$GITHUB_OUTPUT"
          echo "Version $version; published by this run: $publish"

  apk:
    name: Phone app (APK)
    needs: version
    runs-on: ubuntu-latest
    timeout-minutes: 90
    # The signing key only for a run that publishes, which then waits for the maintainer's
    # approval; any other run goes without the environment, its secrets and the wait.
    environment: ${{ needs.version.outputs.publish == 'true' && 'android-release' || '' }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # rust-toolchain.toml names the toolchain; this installs it with the phone's target.
      - name: Toolchain
        run: rustup target add aarch64-linux-android

      - name: Android NDK, platform and build tools
        run: |
          sdkmanager="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          yes | "$sdkmanager" --licenses > /dev/null || true
          "$sdkmanager" --install "ndk;$NDK_VERSION" "platforms;android-35" "build-tools;$BUILD_TOOLS" > /dev/null

      # The same steps as apps/mobile-android/build.ps1 -Release, with Linux's NDK tools.
      - name: Rust library
        run: |
          export ANDROID_HOME="$ANDROID_SDK_ROOT"
          export ANDROID_NDK_ROOT="$ANDROID_SDK_ROOT/ndk/$NDK_VERSION"
          bin="$ANDROID_NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64/bin"
          export CC_aarch64_linux_android="$bin/aarch64-linux-android31-clang"
          export AR_aarch64_linux_android="$bin/llvm-ar"
          export CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER="$bin/aarch64-linux-android31-clang"
          export CARGO_TARGET_DIR=target/android
          cargo build --locked -p vault-mobile-android --profile release --target aarch64-linux-android
          mkdir -p target/android-libs/arm64-v8a
          "$bin/llvm-strip" --strip-all -o target/android-libs/arm64-v8a/libvault_mobile_android.so \
            target/android/aarch64-linux-android/release/libvault_mobile_android.so

      # Android loads the library before the app's first line runs: a symbol missing from the
      # system's libraries is a crash at start, which no test here would show.
      - name: The library loads on Android
        shell: pwsh
        run: >-
          apps/mobile-android/check-library.ps1
          -Library target/android-libs/arm64-v8a/libvault_mobile_android.so
          -Ndk "$env:ANDROID_SDK_ROOT/ndk/$env:NDK_VERSION"

      - name: APK, signed with the release key when publishing
        env:
          PUBLISH: ${{ needs.version.outputs.publish }}
          SIGNING_STORE: ${{ secrets.ANDROID_SIGNING_STORE }}
          VAULT_SIGNING_PASSWORD: ${{ secrets.ANDROID_SIGNING_PASSWORD }}
        run: |
          export ANDROID_HOME="$ANDROID_SDK_ROOT"
          export JAVA_HOME="${JAVA_HOME_21_X64:-$JAVA_HOME_17_X64}"
          if [ "$PUBLISH" = true ]; then
            if [ -z "$SIGNING_STORE" ] || [ -z "$VAULT_SIGNING_PASSWORD" ]; then
              echo "::error::The android-release environment has no signing key"
              exit 1
            fi
            export VAULT_SIGNING_STORE="$RUNNER_TEMP/release.p12"
            trap 'rm -f "$VAULT_SIGNING_STORE"' EXIT
            (umask 077 && printf '%s' "$SIGNING_STORE" | base64 -d > "$VAULT_SIGNING_STORE")
          else
            # build.gradle's trial signing, with a key made for this run alone.
            unset VAULT_SIGNING_PASSWORD
            mkdir -p "$HOME/.android"
            "$JAVA_HOME/bin/keytool" -genkeypair -keystore "$HOME/.android/debug.keystore" \
              -storepass android -alias androiddebugkey -keypass android -keyalg RSA \
              -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US" > /dev/null
          fi
          cd apps/mobile-android
          ./gradlew --no-daemon --quiet assembleRelease

      # What Android reads of the APK, after Gradle merged in the libraries' manifests: the
      # app's protections there, its permissions those listed, and no part of it open to other
      # apps but those meant to be.
      - name: The manifest
        run: |
          export JAVA_HOME="${JAVA_HOME_21_X64:-$JAVA_HOME_17_X64}"
          pwsh apps/mobile-android/check-manifest.ps1 -Sdk "$ANDROID_SDK_ROOT" \
            -Apk target/gradle/vault-mobile-android/outputs/apk/release/vault-mobile-android-release.apk

      - name: Check the signature
        if: needs.version.outputs.publish == 'true'
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          apk=target/gradle/vault-mobile-android/outputs/apk/release/vault-mobile-android-release.apk
          "$ANDROID_SDK_ROOT/build-tools/$BUILD_TOOLS/apksigner" verify --print-certs "$apk" \
            > "$RUNNER_TEMP/signers.txt"
          signers=$(grep -c '^Signer #[0-9]* certificate SHA-256 digest:' "$RUNNER_TEMP/signers.txt")
          signer=$(sed -n 's/^Signer #1 certificate SHA-256 digest: //p' "$RUNNER_TEMP/signers.txt")
          if [ "$signers" != 1 ] || [ "$signer" != "$RELEASE_CERTIFICATE" ]; then
            echo "::error::The APK is not signed with the release certificate alone"
            exit 1
          fi
          mkdir out
          # Named as the sync servers look for it (vault_sync_wire::releases).
          cp "$apk" "out/vault-mobile-android-$VERSION.apk"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: needs.version.outputs.publish == 'true'
        with:
          name: apk
          path: out/
          retention-days: 7
          if-no-files-found: error

  windows:
    name: Desktop app, CLI and server (Windows)
    needs: version
    runs-on: windows-latest
    timeout-minutes: 90
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Toolchain
        run: rustup show active-toolchain
      - name: Build
        run: cargo build --release --locked -p vault-desktop -p vault-cli -p vault-server
      # ASLR, DEP, Control Flow Guard and DLLs from System32 only (.cargo/config.toml) in every
      # exe, or nothing ships.
      # And the version information (apps/windows-version-info.rs). -Authenticode joins once the
      # SignPath Foundation signs them (docs/CODE_SIGNING.md).
      - name: Protections
        shell: pwsh
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: >-
          apps/desktop/check-exe.ps1
          -Exe target/release/vault-desktop.exe, target/release/vault.exe, target/release/vault-server.exe
          -Version $env:VERSION
      # Names without the version: a new one replaces the old file in place, and the browsers
      # and Explorer keep pointing at it.
      - name: Collect
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force out | Out-Null
          Copy-Item target/release/vault-desktop.exe out/vault-desktop.exe
          Copy-Item target/release/vault.exe out/vault.exe
          Copy-Item target/release/vault-server.exe out/vault-server-windows-x64.exe
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows
          path: out/
          retention-days: 7
          if-no-files-found: error

  server:
    name: Server (Linux ${{ matrix.arch }})
    needs: version
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    permissions:
      contents: read
    strategy:
      fail-fast: true
      matrix:
        include:
          # Ubuntu 22.04: a C library older than Debian 12's (the image) and most servers'.
          - arch: x64
            runner: ubuntu-22.04
          - arch: arm64
            runner: ubuntu-22.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Both runner images come with rustup; rust-toolchain.toml names the toolchain it installs.
      # Nothing is fetched and run from a script (if an image ever drops rustup, this fails).
      - name: Toolchain
        run: rustup show active-toolchain
      - name: Build
        run: cargo build --release --locked -p vault-server
      - name: Collect
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          mkdir out
          cp target/release/vault-server "out/vault-server-linux-$ARCH"
          "out/vault-server-linux-$ARCH" --version
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: server-${{ matrix.arch }}
          path: out/
          retention-days: 7
          if-no-files-found: error

  extension:
    name: Browser extension
    needs: version
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # What the browser loads: the extension's files without its tests and notes.
      - name: Zip
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          mkdir out
          cd apps/extension
          git ls-files | grep -v -e '^test/' -e '^package\.json$' -e '^README\.md$' \
            | zip -X -q "$GITHUB_WORKSPACE/out/vault-extension-$VERSION.zip" -@
          unzip -l "$GITHUB_WORKSPACE/out/vault-extension-$VERSION.zip"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: extension
          path: out/
          retention-days: 7
          if-no-files-found: error

  # The release manifest, signed. Only a run that publishes has this job, and its secret, the
  # manifest key, comes from the android-release environment (main only, after the
  # maintainer's approval). The signing tool is built before the key is near, so no build
  # script runs with it in reach; the signature is then checked the way the apps check it,
  # with the keys they carry, and every file against the manifest.
  manifest:
    name: Release manifest (signed)
    needs: [version, apk, windows, server, extension]
    if: needs.version.outputs.publish == 'true'
    runs-on: windows-latest
    timeout-minutes: 30
    environment: android-release
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Toolchain
        run: rustup show active-toolchain
      - name: The signing tool
        run: cargo build --release --locked -p vault-release
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true
      - name: Manifest
        shell: pwsh
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          $out = New-Item -ItemType Directory -Force (Join-Path $env:RUNNER_TEMP "manifest")
          $files = @(Get-ChildItem dist -File | ForEach-Object FullName)
          $date = (Get-Date).ToUniversalTime().ToString("yyyy-MM-ddTHH:mm:ssZ")
          ./target/release/vault-release.exe manifest --version $env:VERSION --date $date `
            --commit $env:GITHUB_SHA --certificate $env:RELEASE_CERTIFICATE `
            --out (Join-Path $out "manifest.json") @files
          if ($LASTEXITCODE -ne 0) { exit 1 }
          Get-Content (Join-Path $out "manifest.json")
      - name: Signature
        shell: pwsh
        env:
          VERSION: ${{ needs.version.outputs.version }}
          MANIFEST_KEY: ${{ secrets.RELEASE_MANIFEST_KEY }}
          VAULT_RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_MANIFEST_PASSWORD }}
        run: |
          if (-not $env:MANIFEST_KEY -or -not $env:VAULT_RELEASE_KEY_PASSWORD) {
            Write-Output "::error::The android-release environment has no manifest key"
            exit 1
          }
          $key = Join-Path $env:RUNNER_TEMP "manifest.key"
          try {
            [IO.File]::WriteAllBytes($key, [Convert]::FromBase64String($env:MANIFEST_KEY.Trim()))
            ./target/release/vault-release.exe sign --key $key `
              --manifest (Join-Path $env:RUNNER_TEMP "manifest/manifest.json") --version $env:VERSION
            if ($LASTEXITCODE -ne 0) { exit 1 }
          } finally {
            Remove-Item -Force $key -ErrorAction SilentlyContinue
          }
      - name: Check the signature with the keys the apps carry
        shell: pwsh
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          ./target/release/vault-release.exe verify `
            --manifest (Join-Path $env:RUNNER_TEMP "manifest/manifest.json") --version $env:VERSION --files dist
          if ($LASTEXITCODE -ne 0) { exit 1 }
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: manifest
          path: ${{ runner.temp }}/manifest/
          retention-days: 7
          if-no-files-found: error

  release:
    name: Attest and publish
    needs: [version, apk, windows, server, extension, manifest]
    # Also when there is no manifest job (a run that doesn't publish); never after one failed.
    if: ${{ !failure() && !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      # The release and its tag.
      contents: write
      # The files' provenance attestations.
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true
      - name: Files
        run: ls -l dist
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: vault-${{ needs.version.outputs.version }}
          path: dist/
          retention-days: 30
          if-no-files-found: error

      - name: Release
        if: needs.version.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version.outputs.version }}
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          for file in manifest.json manifest.json.minisig; do
            if [ ! -s "dist/$file" ]; then
              echo "::error::No signed manifest ($file): nothing is published"
              exit 1
            fi
          done
          notes="$RUNNER_TEMP/notes.md"
          # This version's section of CHANGELOG.md, each paragraph and list item joined onto
          # one line (the release page keeps line breaks).
          awk -v v="$VERSION" 'index($0, "## [" v "]") == 1 {f = 1; next} f && /^## \[/ {exit} f' CHANGELOG.md |
            awk '/^[[:space:]]*$/ { if (have) print line; have = 0; if (started) blank = 1; next }
                 have && line !~ /^#/ && $0 !~ /^[[:space:]]*([-*] |#|[0-9]+\. )/ { s = $0; sub(/^ +/, "", s); line = line " " s; next }
                 { if (have) print line; if (blank) print ""; blank = 0; line = $0; have = 1; started = 1 }
                 END { if (have) print line }' > "$notes"
          if ! grep -q '[^[:space:]]' "$notes"; then
            echo "::error file=CHANGELOG.md::No section for $VERSION"
            exit 1
          fi
          prev=$(git tag --list 'v*' --sort=-v:refname | head -n 1)
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/vault-server"
          cat >> "$notes" << EOF

          ### Downloads
          - **Desktop (Windows x64):** \`vault-desktop.exe\`, one file: run it. It is also what the browser extension talks to. It needs the Microsoft Visual C++ runtime (\`vc_redist.x64.exe\`), which most computers already have; a copy of its DLL beside the exe is ignored, on purpose. Not signed for Windows yet, so SmartScreen may ask first (More info → Run anyway).
          - **Phone (Android, 64-bit ARM):** \`vault-mobile-android-$VERSION.apk\`, signed with the release certificate (SHA-256 \`$RELEASE_CERTIFICATE\`). Phones find it by themselves within the hour (Settings → About and updates), from GitHub or from a sync server that follows the releases.
          - **Browser extension (Chrome, Edge, Firefox):** \`vault-extension-$VERSION.zip\`. Turn the link on in the desktop app first (Settings → Browser extension). Chrome and Edge: unzip it, open \`chrome://extensions\`, turn on Developer mode, choose *Load unpacked*. Firefox 153+: open \`about:debugging#/runtime/this-firefox\`, choose *Load Temporary Add-on…* and pick the zip (it stays until Firefox closes; not signed by Mozilla yet).
          - **Sync server:** the image \`$image:$VERSION\` (amd64, arm64), or the program \`vault-server-linux-x64\`, \`vault-server-linux-arm64\`, \`vault-server-windows-x64.exe\`. With \`--app-updates $GITHUB_REPOSITORY\` (as in \`apps/server/compose.yaml\`) it hands each new phone app to your phones by itself.
          - **Command line (Windows x64):** \`vault.exe\`.

          Each file's SHA-256 is listed next to it below, and in \`manifest.json\`, signed with the project's manifest key (\`manifest.json.minisig\`): the apps take an update only with that signature. \`minisign -Vm manifest.json -P <key>\` checks it, with a key from docs/CODE_SIGNING.md. \`gh attestation verify <file> --repo $GITHUB_REPOSITORY\` checks a file was built here, from commit $GITHUB_SHA.
          EOF
          if [ -n "$prev" ]; then
            printf '\n**Full changelog**: %s/%s/compare/%s...%s\n' \
              "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$prev" "$TAG" >> "$notes"
          fi
          gh release create "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "Vault $VERSION" --notes-file "$notes" --latest

  image:
    name: Server image (ghcr.io)
    needs: [version, server, release]
    if: needs.version.outputs.publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: server-*
          path: context
          merge-multiple: true
      - name: Context and tags
        id: image
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          mv context/vault-server-linux-x64 context/vault-server-amd64
          mv context/vault-server-linux-arm64 context/vault-server-arm64
          mkdir context/data
          name="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/vault-server"
          {
            echo "name=$name"
            echo "tags<<EOF"
            echo "$name:$VERSION"
            echo "$name:${VERSION%.*}"
            echo "$name:latest"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: context
          file: apps/server/release.Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.image.outputs.tags }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ needs.version.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.licenses=AGPL-3.0-or-later
            org.opencontainers.image.description=Vault's self-hosted sync server
          sbom: true
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ steps.image.outputs.name }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
