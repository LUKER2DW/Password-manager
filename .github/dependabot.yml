# Dependabot: security updates as soon as an advisory appears, and a weekly round of version
# updates grouped into one pull request per ecosystem. Version updates wait seven days after
# publication. Security updates are exempt from that wait.
version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    ignore:
      # jni 0.22 rewrote its API (Env and EnvUnowned, closures to attach a thread, typed
      # signatures, Global<T>). No check in CI builds for Android, so a version bump would pass
      # and break the phone app: it is moved by hand, with the Android code.
      - dependency-name: jni
        versions: [">= 0.22"]
    groups:
      cargo:
        patterns: ["*"]
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: gradle
    directory: /apps/mobile-android
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      gradle:
        patterns: ["*"]

  - package-ecosystem: docker
    directory: /apps/server
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
