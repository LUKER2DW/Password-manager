<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Vault</title>
    <link rel="stylesheet" href="tokens.css" />
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <!-- Four places: the site in front, everything in the vault, the one-time codes, and the
         generator. -->
    <nav id="tabs" hidden>
      <button id="tab-site" type="button" aria-pressed="true"></button>
      <button id="tab-vault" type="button" aria-pressed="false"></button>
      <button id="tab-codes" type="button" aria-pressed="false"></button>
      <button id="tab-gen" type="button" aria-pressed="false"></button>
    </nav>

    <main id="main">
      <!-- A newer version of this extension. -->
      <aside id="update" hidden>
        <span class="update-mark" data-icon="download"></span>
        <p id="update-text"></p>
        <button id="update-now" class="plain small" type="button" hidden></button>
      </aside>

      <!-- The site the logins belong to: the one thing to read before filling. -->
      <section id="site" hidden>
        <header class="site-head">
          <h1 id="origin"></h1>
          <svg class="stroke" viewBox="0 0 200 8" preserveAspectRatio="none" aria-hidden="true">
            <path d="M2 5.2 C 28 2.4, 52 6.6, 84 4.1 S 150 2.2, 198 4.8" />
          </svg>
        </header>

        <!-- A login typed into this page a moment ago, not in the vault yet. -->
        <div id="offer" class="offer" hidden>
          <p id="offer-title" class="offer-title"></p>
          <p id="offer-text"></p>
          <div class="row">
            <button id="offer-yes" class="primary" type="button"></button>
            <button id="offer-no" class="quiet" type="button"></button>
          </div>
        </div>

        <p id="site-asks" class="asks" hidden></p>
        <div id="list" class="logins"></div>
        <div id="site-empty" class="empty" hidden>
          <h2 id="site-empty-title"></h2>
          <p id="site-empty-text"></p>
        </div>
      </section>

      <!-- Every login in the vault. -->
      <section id="vault" hidden>
        <div class="search-row">
          <label class="search" data-icon="search">
            <input id="search" type="search" autocomplete="off" spellcheck="false" />
          </label>
          <button id="add-login" class="plain" type="button" data-icon="plus"><span id="add-login-text"></span></button>
        </div>
        <p id="vault-asks" class="asks" hidden></p>
        <div id="vault-list" class="logins"></div>
        <p id="vault-empty" class="empty-line" hidden></p>
      </section>

      <!-- The logins' one-time codes, each behind dots and an eye. -->
      <section id="codes" hidden>
        <p id="codes-asks" class="asks" hidden></p>
        <div id="codes-list" class="code-list"></div>
        <div id="codes-empty" class="empty" hidden>
          <h2 id="codes-empty-title"></h2>
          <p id="codes-empty-text"></p>
        </div>
      </section>

      <!-- A password from the app's generator. -->
      <section id="gen" hidden>
        <div class="gen-well">
          <p id="gen-password" class="gen-password" aria-live="polite"></p>
          <button id="gen-again" class="icon" type="button" data-icon="refresh"></button>
        </div>
        <div class="strength">
          <span id="gen-meter" class="meter" data-level="0" aria-hidden="true"><i></i><i></i><i></i><i></i></span>
          <span id="gen-strength" class="strength-word"></span>
          <span id="gen-bits" class="bits"></span>
        </div>

        <div class="choice" role="group">
          <button id="gen-mode-chars" type="button" aria-pressed="true"></button>
          <button id="gen-mode-words" type="button" aria-pressed="false"></button>
        </div>

        <div class="count">
          <label id="gen-count-label" for="gen-count"></label>
          <input id="gen-count-number" type="number" inputmode="numeric" min="4" max="128" value="20" />
          <input id="gen-count" class="slider" type="range" min="4" max="128" value="20" />
        </div>

        <div id="gen-chars" class="options">
          <label class="box"><input id="gen-upper" type="checkbox" /><span id="gen-upper-label"></span></label>
          <label class="box"><input id="gen-lower" type="checkbox" /><span id="gen-lower-label"></span></label>
          <label class="box"><input id="gen-digits" type="checkbox" /><span id="gen-digits-label"></span></label>
          <label class="box"><input id="gen-symbols" type="checkbox" /><span id="gen-symbols-label"></span></label>
          <label class="box wide"><input id="gen-avoid_ambiguous" type="checkbox" /><span id="gen-avoid_ambiguous-label"></span></label>
        </div>

        <div id="gen-words" class="options" hidden>
          <label class="box"><input id="gen-capitalize" type="checkbox" /><span id="gen-capitalize-label"></span></label>
          <label class="box"><input id="gen-number" type="checkbox" /><span id="gen-number-label"></span></label>
          <div class="separator wide">
            <span id="gen-separator-label"></span>
            <div id="gen-separators" class="presets" role="group">
              <button type="button" data-separator="-" aria-pressed="false">-</button>
              <button type="button" data-separator="." aria-pressed="false">.</button>
              <button type="button" data-separator="_" aria-pressed="false">_</button>
              <button id="gen-space" type="button" data-separator=" " aria-pressed="false">␣</button>
              <input id="gen-separator" type="text" maxlength="3" autocomplete="off" spellcheck="false" />
            </div>
          </div>
        </div>

        <div class="actions">
          <button id="gen-copy" class="primary" type="button"></button>
          <button id="gen-use" class="plain" type="button"></button>
        </div>
        <p id="gen-note" class="note"></p>
      </section>

      <!-- A new login, made here and saved by the app. -->
      <form id="new-login" hidden>
        <button id="new-back" class="quiet back" type="button" data-icon="back"><span id="new-back-text"></span></button>
        <h2 id="new-title"></h2>
        <label class="field-input"><span id="new-site-label"></span><input id="new-site" type="text" autocomplete="off" spellcheck="false" required /></label>
        <label class="field-input"><span id="new-name-label"></span><input id="new-name" type="text" autocomplete="off" /></label>
        <label class="field-input"><span id="new-user-label"></span><input id="new-user" type="text" autocomplete="off" spellcheck="false" /></label>
        <label class="field-input"><span id="new-pass-label"></span>
          <span class="well-row">
            <input id="new-pass" type="password" autocomplete="off" spellcheck="false" required />
            <button id="new-show" class="eye" type="button" aria-pressed="false"><svg viewBox="0 0 24 24" aria-hidden="true"><g class="open"><path d="M2.062 12.348a1 1 0 0 1 0-.696 10.75 10.75 0 0 1 19.876 0 1 1 0 0 1 0 .696 10.75 10.75 0 0 1-19.876 0" /><circle cx="12" cy="12" r="3" /></g><path class="shut" d="M3 10.5c4.8 5.6 13.2 5.6 18 0M7 14.2l-1.6 2.6M12 15.6v3M17 14.2l1.6 2.6" /></svg></button>
            <button id="new-generate" class="icon" type="button" data-icon="refresh"></button>
          </span>
        </label>
        <p id="new-error" class="problem" role="alert"></p>
        <div class="actions">
          <button id="new-save" class="primary" type="submit"></button>
          <button id="new-cancel" class="quiet" type="button"></button>
        </div>
      </form>

      <!-- One login, opened from a list. -->
      <section id="entry" hidden>
        <button id="entry-back" class="quiet back" type="button" data-icon="back"><span id="entry-back-text"></span></button>
        <div class="who">
          <span id="entry-tile" class="big-tile"></span>
          <div class="who-lines">
            <h2 id="entry-title"></h2>
            <p id="entry-sub"></p>
          </div>
        </div>
        <p id="entry-asks" class="asks" hidden></p>
        <dl class="facts">
          <div class="fact" id="field-username">
            <dt class="label user" data-icon="user"><span id="label-username"></span></dt>
            <dd id="value-username" class="value"></dd>
            <div class="acts"><button id="copy-username" class="plain small" type="button"></button></div>
          </div>
          <div class="fact" id="field-password">
            <dt class="label key" data-icon="key"><span id="label-password"></span></dt>
            <!-- Dots, or while shown the password as text that can be selected. -->
            <dd id="value-password" class="value secret"></dd>
            <div class="acts">
              <button id="show-password" class="eye" type="button" aria-pressed="false"><svg viewBox="0 0 24 24" aria-hidden="true"><g class="open"><path d="M2.062 12.348a1 1 0 0 1 0-.696 10.75 10.75 0 0 1 19.876 0 1 1 0 0 1 0 .696 10.75 10.75 0 0 1-19.876 0" /><circle cx="12" cy="12" r="3" /></g><path class="shut" d="M3 10.5c4.8 5.6 13.2 5.6 18 0M7 14.2l-1.6 2.6M12 15.6v3M17 14.2l1.6 2.6" /></svg></button>
              <button id="copy-password" class="plain small" type="button"></button>
            </div>
            <p id="password-note" class="shown-note" hidden><span id="password-left"></span></p>
          </div>
          <div class="fact" id="field-code">
            <dt class="label clock" data-icon="clock"><span id="label-code"></span></dt>
            <!-- Dots, or while shown the code in two halves. -->
            <dd id="value-code" class="value"><span id="code-digits" class="code-digits" aria-live="polite"></span></dd>
            <div class="acts">
              <span id="code-clock" class="code-clock" hidden>
                <svg viewBox="0 0 24 24" aria-hidden="true">
                  <circle class="track" cx="12" cy="12" r="9" />
                  <circle id="code-arc" class="arc" cx="12" cy="12" r="9" transform="rotate(-90 12 12)" />
                </svg>
                <span id="code-left" class="code-left"></span>
              </span>
              <button id="show-code" class="eye" type="button" aria-pressed="false"><svg viewBox="0 0 24 24" aria-hidden="true"><g class="open"><path d="M2.062 12.348a1 1 0 0 1 0-.696 10.75 10.75 0 0 1 19.876 0 1 1 0 0 1 0 .696 10.75 10.75 0 0 1-19.876 0" /><circle cx="12" cy="12" r="3" /></g><path class="shut" d="M3 10.5c4.8 5.6 13.2 5.6 18 0M7 14.2l-1.6 2.6M12 15.6v3M17 14.2l1.6 2.6" /></svg></button>
              <button id="copy-code" class="plain small" type="button"></button>
            </div>
          </div>
          <div class="fact" id="field-site">
            <dt class="label globe" data-icon="globe"><span id="label-site"></span></dt>
            <dd id="value-site" class="value"></dd>
            <div class="acts"><button id="open-site" class="quiet small" type="button" data-icon="external"><span id="open-site-text"></span></button></div>
          </div>
        </dl>
        <div id="entry-actions" class="actions">
          <button id="entry-fill" class="primary" type="button" hidden></button>
          <button id="entry-fill-code" class="plain" type="button" hidden></button>
        </div>
      </section>

      <!-- The item lock's PIN or password, for one request. -->
      <form id="check" hidden>
        <div class="who">
          <span id="check-tile" class="big-tile"></span>
          <div class="who-lines">
            <h2 id="check-title"></h2>
            <p id="check-username"></p>
          </div>
        </div>
        <p id="check-text" class="lead"></p>
        <div class="row">
          <input id="check-input" type="password" autocomplete="off" spellcheck="false" />
          <button id="check-go" class="primary" type="submit"></button>
        </div>
        <p id="check-error" class="problem" role="alert"></p>
        <button id="check-back" class="quiet back" type="button" data-icon="back"><span id="check-back-text"></span></button>
      </form>

      <!-- Connecting to the app. -->
      <section id="pair" hidden>
        <div id="pair-art" aria-hidden="true">
          <img src="icons/icon128.png" width="48" height="48" alt="" />
          <svg id="pair-mark" viewBox="0 0 64 40">
            <path d="M6 22 C 14 9, 24 9, 30 20 S 46 33, 58 16" />
            <path d="M49 13 L 58 16 L 54 25" />
          </svg>
        </div>
        <h2 id="pair-title"></h2>
        <div id="pair-code" class="code-boxes" hidden></div>
        <p id="pair-text" class="lead"></p>
        <div class="actions">
          <button id="pair-button" class="primary" type="button"></button>
          <button id="pair-restart" class="quiet" type="button" hidden></button>
        </div>
      </section>

      <!-- A title and a sentence in place of a view. -->
      <section id="message" hidden>
        <span id="message-icon" class="message-icon" hidden></span>
        <h2 id="message-title"></h2>
        <p id="message-text" class="lead"></p>
      </section>

      <!-- The extension's own settings. -->
      <section id="prefs" hidden>
        <button id="prefs-back" class="quiet back" type="button" data-icon="back"><span id="prefs-back-text"></span></button>
        <h2 id="prefs-title"></h2>
        <div class="setting">
          <label class="box"><input id="prefs-saving" type="checkbox" /><span id="prefs-saving-label"></span></label>
          <p id="prefs-saving-hint" class="hint"></p>
          <p id="prefs-saving-state" class="problem" role="status"></p>
        </div>
        <div class="setting">
          <label class="box"><input id="prefs-passkeys" type="checkbox" /><span id="prefs-passkeys-label"></span></label>
          <p id="prefs-passkeys-hint" class="hint"></p>
        </div>
        <p id="prefs-app" class="hint"></p>
        <p id="prefs-version" class="hint version"></p>
      </section>
    </main>

    <p id="toast" role="status" hidden></p>

    <footer id="foot" hidden>
      <span id="foot-dot" aria-hidden="true"></span>
      <span id="foot-text"></span>
      <button id="foot-lock" class="quiet small" type="button" data-icon="lock"><span id="foot-lock-text"></span></button>
      <button id="foot-prefs" class="quiet small icon-only" type="button" data-icon="gear"></button>
    </footer>

    <script type="module" src="popup.js"></script>
  </body>
</html>
