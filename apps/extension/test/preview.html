<!doctype html>
<!--
  Visual review of the extension's windows without installing it.

  Serve the `extension` folder (for example `python -m http.server 8766` inside it) and open
  http://localhost:8766/test/preview.html?state=logins
  Popup states: logins, offer, vault, entry, revealed, revealed_long, code, code_old, codes,
  codes_shown,
  generator, words, long, new_login, pin, wrong_pin, hello, setup, pair, pair_wait, empty,
  locked, not_running, insecure, item_locked, username, update, update_manual, prefs,
  long_texts.
  In-page frames: inline (the logins under a field), inline_passkeys (with the site's passkeys,
  while the page waits for a field's suggestions), suggest (a new password), save (the save
  offer).
  A stand-in for the browser's `chrome` object, and for the app (test/preview-app.js, through
  the import map below), answers with fixed test data; nothing here talks to the app.
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Extension preview</title>
    <script type="importmap">
      { "imports": { "../app.js": "./preview-app.js" } }
    </script>
  </head>
  <body>
    <script type="module">
      const state = new URLSearchParams(location.search).get("state") || "logins";
      const messages = await (await fetch("../_locales/en/messages.json")).json();
      const page = ["vault", "entry", "revealed", "revealed_long", "code", "code_old"].includes(state)
        ? "https://news.example/"
        : "https://github.com/login";
      const pinStates = ["pin", "wrong_pin"];
      const listing = {
        check: pinStates.includes(state) ? "pin" : "app",
        hello: !pinStates.includes(state) && state !== "setup",
        always_asks: true,
      };
      const longName = "A login with a very long name that goes on and on past the edge";
      const logins = {
        type: "logins",
        origin: state === "long_texts" ? "https://accounts.some-very-long-subdomain.of-an-example-site.example" : "https://github.com",
        ...listing,
        items: [
          { id: "01", title: "GitHub", username: "octocat", locked: true, has_code: true },
          { id: "02", title: state === "long_texts" ? longName : "GitHub (work)", username: "hubot@work.example", locked: true, has_code: false },
          { id: "03", title: "GitHub admin", username: "root", locked: true, has_code: false },
        ],
      };
      const vault = {
        type: "vault",
        ...listing,
        items: [
          { id: "11", title: "Bank", username: "test.user", site: "https://bank.example", locked: true, has_password: true, has_code: false },
          { id: "01", title: "GitHub", username: "octocat", site: "github.com", locked: true, has_password: true, has_code: true },
          { id: "12", title: "Mail", username: "test.user@mail.example", site: "mail.example", locked: true, has_password: true, has_code: false },
          { id: "13", title: "Shop", username: "", site: "*.shop.example", locked: true, has_password: true, has_code: false },
          { id: "14", title: "Video games", username: "player-one", site: "games.example", locked: true, has_password: true, has_code: true },
          { id: "15", title: "Forum", username: "nightowl", site: "forum.example", locked: true, has_password: true, has_code: false },
        ],
      };
      const lists = {
        empty: { type: "logins", origin: "https://github.com", ...listing, items: [] },
        insecure: { type: "error", code: "insecure_page" },
      };
      const tooOld = ["code_old"].includes(state);

      /** What the app would answer to each request, for this state. */
      globalThis.previewAnswer = async (request) => {
        if (state === "not_running") return { type: "error", code: "not_running" };
        if (state === "pair_wait") return { type: "error", code: "not_paired" };
        if (state === "locked" && request.type !== "generate") return { type: "error", code: "locked" };
        switch (request.type) {
          case "status":
            return { type: "status", locked: false, name: state === "long_texts" ? "A vault with a name far too long for the footer" : "Personal" };
          case "vault":
            return vault;
          case "logins":
            return lists[state] ?? (["vault", "entry", "revealed", "revealed_long", "code", "code_old"].includes(state) ? { ...logins, origin: "https://news.example", items: [] } : logins);
          case "generate": {
            if (request.words) return { type: "generated", id: "g2", password: "Orbit-Lantern-Velvet4-Thicket-Salad-Ripple", bits: 81 };
            const length = request.length ?? 20;
            const alphabet = "Hn4$wq9-Tz2#vLp8Kx3m@Rb7!Yc5%";
            let password = "";
            for (let i = 0; i < length; i++) password += alphabet[(i * 7 + length) % alphabet.length];
            return { type: "generated", id: `g${length}`, password, bits: Math.round(length * 6.4) };
          }
          case "reveal":
            if (request.what === "code") {
              if (tooOld) return { type: "error", code: "bad_request" };
              return { type: "code_shown", code: "932663", period: 30, left: 17 };
            }
            return { type: "reveal", password: state === "revealed_long" ? "Gh-demo-7Kq!vR2#pL9w x_Tz4&mN8@Yb3^cV6*" : "Gh-demo-7Kq!vR2#pL9w" };
          case "fill":
            if (pinStates.includes(state) && !request.check) return { type: "error", code: "item_locked", check: "pin" };
            if (state === "wrong_pin") return { type: "error", code: "wrong_check", check: "pin", left: 3 };
            if (state === "setup" || state === "item_locked") return { type: "error", code: "item_locked", check: "app" };
            return { type: "fill", origin: "https://github.com", username: "octocat", password: "test" };
          case "lock":
            return { type: "locked_now" };
          default:
            return { type: "error", code: "failed" };
        }
      };

      const session = {};
      if (state === "offer") {
        session.pendingSaves = { 1: { id: "offer-1", url: page, origin: "https://github.com", username: "new.user@example.com", password: "test", at: Date.now() } };
      }
      const local = {};
      if (state === "update") local.extensionUpdate = { version: "0.5.0", manual: false };
      if (state === "update_manual") local.extensionUpdate = { version: "0.5.0", manual: true };
      if (state === "long") local.generatorOptions = { length: 128 };
      window.chrome = {
        i18n: {
          getMessage: (key, parts = []) => {
            const entry = messages[key];
            let text = entry?.message || "";
            for (const [name, holder] of Object.entries(entry?.placeholders ?? {})) {
              text = text.replaceAll(`$${name.toUpperCase()}$`, parts[Number(holder.content.slice(1)) - 1] ?? "");
            }
            return text;
          },
        },
        runtime: {
          getURL: (path) => `../${path.replace(/^\//, "")}`,
          getManifest: () => ({ version: "0.4.7" }),
          // `&os=linux` shows the words of a system without Windows Hello.
          getPlatformInfo: async () => ({ os: new URLSearchParams(location.search).get("os") || "win" }),
          sendMessage: async (message) => {
            if (message.kind === "frame-logins") {
              const passkeys = {
                origin: logins.origin,
                site: "github.com",
                check: "pin",
                hello: true,
                items: [
                  { id: "01", credential: "Y3JlZA", title: "GitHub", userName: "octocat", displayName: "The Octocat", locked: false },
                  { id: "02", credential: "d29yaw", title: "GitHub (work)", userName: "hubot@work.example", displayName: "", locked: true },
                ],
              };
              const listed = { origin: logins.origin, hello: true, check: "pin", items: logins.items };
              return state === "inline_passkeys" ? { ...listed, items: logins.items.slice(0, 1), passkeys } : listed;
            }
            if (message.kind === "frame-suggest") return { password: "q7#Vm2-kTz9@pLw4Rx8n", bits: 129 };
            if (message.kind === "frame-save-info") return { id: "offer-1", origin: "https://github.com", username: "new.user@example.com" };
            return undefined;
          },
          sendNativeMessage: async () => ({ type: "error", code: "not_paired" }),
        },
        storage: {
          session: {
            get: async (key) => ({ [key]: session[key] }),
            set: async (values) => Object.assign(session, values),
          },
          local: {
            get: async (key) => (typeof key === "string" ? { [key]: local[key] } : { ...local }),
            set: async (values) => Object.assign(local, values),
          },
        },
        privacy: {
          services: {
            passwordSavingEnabled: {
              get: async () => ({ levelOfControl: "controlled_by_this_extension", value: false }),
              set: async () => {},
              clear: async () => {},
            },
          },
        },
        tabs: {
          query: async () => [{ id: 1, url: page }],
          get: async () => ({ id: 1, url: page }),
          create: async () => {},
          sendMessage: async () => {},
        },
        scripting: {
          executeScript: async () => [{ result: state === "username" ? "username" : "none" }],
        },
      };
      window.close = () => {};

      const frame = ["inline", "inline_passkeys", "save", "suggest"].includes(state);
      const html = await (await fetch(frame ? "../inline.html" : "../popup.html")).text();
      const doc = new DOMParser().parseFromString(html, "text/html");
      for (const href of frame ? ["../tokens.css", "../inline.css"] : ["../tokens.css", "../popup.css"]) {
        const style = document.createElement("link");
        style.rel = "stylesheet";
        style.href = href;
        document.head.append(style);
      }
      document.body.replaceChildren(...[...doc.body.children].filter((el) => el.tagName !== "SCRIPT"));
      // Images in the window's markup are relative to the extension's folder.
      for (const img of document.querySelectorAll("img[src]")) img.src = `../${img.getAttribute("src")}`;
      if (frame) {
        // The frame's size in a page, over a page-like background.
        document.body.style.width = "300px";
        document.documentElement.style.background = matchMedia("(prefers-color-scheme: dark)").matches ? "#0b0f14" : "#e9edf3";
        location.hash = state === "save" ? "#save" : state === "suggest" ? "#new" : "#logins";
        window.IntersectionObserver = class { observe() {} };
        await import("../inline.js");
      } else {
        // Connected already, except when the connecting view itself is under review.
        const link = await import("../link.js");
        await link.dropKey();
        if (state !== "pair") {
          const key = await crypto.subtle.importKey("raw", new Uint8Array(32), { name: "HMAC", hash: "SHA-256" }, false, ["sign"]);
          await link.saveKey(key);
        }
        if (state === "pair_wait") await link.startWaiting("74At LSYM");
        await import("../popup.js");
        const click = (selector) => document.querySelector(selector)?.click();
        const wait = (ms) => new Promise((done) => setTimeout(done, ms));
        await wait(200);
        if (["generator", "words", "long"].includes(state)) click("#tab-gen");
        if (state === "words") {
          await wait(80);
          click("#gen-mode-words");
        }
        if (state === "new_login") {
          click("#tab-gen");
          await wait(200);
          click("#gen-use");
        }
        if (["entry", "revealed", "revealed_long", "code", "code_old"].includes(state)) {
          click("#vault-list .login-row:nth-child(2) .login");
          await wait(50);
          if (state.startsWith("revealed")) click("#show-password");
          if (state.startsWith("code")) click("#show-code");
        }
        if (["pin", "wrong_pin", "setup", "item_locked"].includes(state)) {
          click("#list .login-row:nth-child(2) .login");
          if (state === "wrong_pin") {
            await wait(50);
            document.querySelector("#check-input").value = "0000";
            click("#check-go");
          }
        }
        if (state === "prefs") click("#foot-prefs");
        if (state.startsWith("codes")) {
          click("#tab-codes");
          await wait(50);
          if (state === "codes_shown") click("#codes-list .code-row button.eye");
        }
      }
      document.documentElement.dataset.ready = "1";
    </script>
  </body>
</html>
