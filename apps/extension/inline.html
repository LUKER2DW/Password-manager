<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Vault</title>
    <link rel="stylesheet" href="tokens.css" />
    <link rel="stylesheet" href="inline.css" />
  </head>
  <body>
    <div class="card">
      <!-- Under a sign-in field: the logins saved for this site. -->
      <section id="logins" hidden>
        <div id="list" role="listbox"></div>
        <hr />
        <button id="manage" class="foot" type="button">
          <span id="manage-text"></span>
          <svg class="mark" viewBox="0 0 24 24" aria-hidden="true">
            <rect x="4" y="10.5" width="16" height="10.5" rx="2.5" />
            <path d="M8 10.5V7.5a4 4 0 0 1 8 0v3" />
          </svg>
        </button>
      </section>

      <!-- Under a new-password field: a strong password that fits the site. -->
      <section id="new" hidden>
        <button id="new-use" class="row" type="button">
          <span class="key" aria-hidden="true">
            <svg viewBox="0 0 24 24"><circle cx="8" cy="15" r="4" /><path d="M10.8 12.2 20 3M17 6l3 3M14.5 8.5l2.5 2.5" /></svg>
          </span>
          <span class="lines">
            <span id="new-title" class="name"></span>
            <span id="new-password" class="secret mono"></span>
          </span>
        </button>
        <hr />
        <button id="new-again" class="foot" type="button">
          <span id="new-again-text"></span>
          <svg class="mark" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M3 12a9 9 0 0 1 15.5-6.2L21 8M21 3v5h-5M21 12a9 9 0 0 1-15.5 6.2L3 16M3 21v-5h5" />
          </svg>
        </button>
      </section>

      <!-- In the corner after a sign-in: save what was typed? -->
      <section id="save" hidden>
        <div class="save-head">
          <img id="save-icon" class="favicon" alt="" />
          <div class="lines">
            <span id="save-title" class="name"></span>
            <span id="save-who" class="sub"></span>
          </div>
        </div>
        <p id="save-note" role="status"></p>
        <div class="actions">
          <button id="save-no" class="plain" type="button"></button>
          <button id="save-yes" class="primary" type="button"></button>
        </div>
      </section>
    </div>

    <script type="module" src="inline.js"></script>
  </body>
</html>
