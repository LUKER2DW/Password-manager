[package]
name = "vault-server"
version = "0.0.0"
description = "Self-hosted sync server: stores each device's sealed copy of a vault, never a key"
edition.workspace = true
rust-version.workspace = true
license = "AGPL-3.0-or-later"
publish.workspace = true

[lints]
workspace = true

[dependencies]
vault-sync-wire = { path = "../../crates/sync-wire" }
anyhow = "1"
axum = { version = "0.8", default-features = false, features = ["http1", "json", "query", "tokio"] }
clap = { version = "4.6", features = ["derive", "env"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal", "sync", "time"] }
# HTTPS of its own (`serve --tls`): a certificate authority made on first start, pinned by
# the devices (its SHA-256 travels in the address), so a home network needs no domain name.
rcgen = { version = "0.14", default-features = false, features = ["crypto", "pem", "ring"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
if-addrs = "0.13"
sha2 = "0.11"

[dev-dependencies]
tempfile = "3.27"
ureq = "3.5"
# End to end: two devices sync a real vault through a running server.
vault-core = { path = "../../crates/core" }
vault-platform = { path = "../../crates/platform" }
