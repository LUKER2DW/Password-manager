[package]
name = "vault-server"
version = "0.4.7"
description = "Self-hosted sync server: stores each device's sealed copy of a vault, never a key"
edition.workspace = true
rust-version.workspace = true
license = "AGPL-3.0-or-later"
publish.workspace = true

[lints]
workspace = true

[dependencies]
vault-sync-wire = { path = "../../crates/sync-wire" }
anyhow = "1"
axum = { version = "0.8", default-features = false, features = ["http1", "json", "query", "tokio"] }
clap = { version = "4.6", features = ["derive", "env"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal", "sync", "time"] }
# The connections served directly (header and write time limits, a cap on open ones); the
# same versions and features axum already uses.
hyper = { version = "1.1", default-features = false, features = ["server", "http1"] }
hyper-util = { version = "0.1.3", default-features = false, features = ["tokio"] }
http-body = "1"
tower = { version = "0.5.2", default-features = false, features = ["util"] }
# HTTPS of its own (`serve --tls`): a certificate authority made on first start, pinned by
# the devices (its SHA-256 travels in the address), so a home network needs no domain name.
rcgen = { version = "0.14", default-features = false, features = ["crypto", "pem", "ring"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
if-addrs = "0.15"
sha2 = "0.11"
# `vault-server invite --address`: the link drawn as a QR code in the terminal.
qrcode = { version = "0.14", default-features = false }
# Following the project's releases for the phone app's updates (updates.rs), over HTTPS.
ureq = { version = "3.5", default-features = false, features = ["rustls"] }

[build-dependencies]
# The version information in the Windows .exe (../windows-version-info.rs).
embed-resource = "3"

[dev-dependencies]
tempfile = "3.27"
# Release manifests signed with test keys (the phone app's update, handed on unchanged).
vault-sync-wire = { path = "../../crates/sync-wire", features = ["test-signing"] }
# End to end: two devices sync a real vault through a running server.
vault-core = { path = "../../crates/core" }
vault-platform = { path = "../../crates/platform" }
