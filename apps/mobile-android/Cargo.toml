[package]
name = "vault-mobile-android"
version = "0.1.0"
description = "The phone app as an Android app (the native library an APK loads)"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

# Built only for Android: `apps/mobile-android/build.ps1`. On other targets the library is
# empty.
[lib]
crate-type = ["cdylib"]

# `deny` instead of `forbid`: the entry point the activity calls must be `no_mangle`.
[lints.rust]
unsafe_code = "deny"
missing_debug_implementations = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }

[target.'cfg(target_os = "android")'.dependencies]
vault-mobile = { path = "../mobile" }
slint = { version = "1.18", features = ["backend-android-activity-06"] }
# The activity's and autofill's Java side (java/…): the file picker, fingerprint unlock,
# autofill, updates.
jni = "0.21"
ndk-context = "0.1"
# Device secrets and passwords crossing from Java are wiped once used.
zeroize = "1.9"

# The APK itself (manifest, Java shell, signing) is built by Gradle from AndroidManifest.xml and
# build.gradle; build.ps1 builds this library with cargo and hands it over.
