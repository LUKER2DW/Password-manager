[package]
name = "vault-mobile-android"
version = "0.1.0"
description = "The phone app as an Android app (the native library an APK loads)"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

# Built only for Android: `apps/mobile-android/build.ps1`. On other targets the library is
# empty.
[lib]
crate-type = ["cdylib"]

# `deny` instead of `forbid`: the entry point the activity calls must be `no_mangle`.
[lints.rust]
unsafe_code = "deny"
missing_debug_implementations = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }

[target.'cfg(target_os = "android")'.dependencies]
vault-mobile = { path = "../mobile" }
slint = { version = "1.18", features = ["backend-android-activity-06"] }
# The activity's and autofill's Java side (java/…): the file picker, fingerprint unlock,
# autofill, updates.
jni = "0.21"
ndk-context = "0.1"
# Device secrets and passwords crossing from Java are wiped once used.
zeroize = "1.9"

# For cargo-apk: the APK's identity, what it may do, which phones it runs on.
[package.metadata.android]
package = "org.passwordvault.phone"
build_targets = ["aarch64-linux-android", "x86_64-linux-android"]
# Sync with the person's own server or WebDAV folder; fingerprint unlock; updates of the app
# from that server (Android still asks the person, and checks the update's signature).
uses_permission = [
    { name = "android.permission.INTERNET" },
    { name = "android.permission.USE_BIOMETRIC" },
    { name = "android.permission.REQUEST_INSTALL_PACKAGES" },
]
# The launcher icon (res/: the desktop's safe, as an adaptive icon and plain PNGs).
resources = "res"

[package.metadata.android.sdk]
min_sdk_version = 28
target_sdk_version = 35

[package.metadata.android.application]
label = "Vault"
# The activity is NativeActivity plus the system's file picker (VaultActivity.java), compiled
# into the APK by build.ps1.
has_code = true
icon = "@mipmap/ic_launcher"
# Plain http is let through by Android only so a Tailscale address (100.x.y.z, encrypted by
# WireGuard) works; the app itself refuses http:// to anywhere else (sync/http.rs).
uses_cleartext_traffic = true

[package.metadata.android.application.activity]
name = "org.passwordvault.phone.VaultActivity"
config_changes = "orientation|screenSize|keyboardHidden|keyboard|uiMode|density"
launch_mode = "singleTask"
orientation = "portrait"
