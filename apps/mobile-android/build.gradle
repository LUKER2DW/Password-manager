// The phone app's APK: the Java shell (java/), its words and icon (res/), the manifest, and the
// Rust library cargo builds (build.ps1 puts it in target/android-libs/<abi>/). Gradle is used
// for packaging, and for the two libraries the Java side needs: Google's code scanner and
// AndroidX Credentials (the passkey provider).
plugins {
    id 'com.android.application' version '9.5.2'
}

// The version comes from Cargo.toml, so the app, the update check and the APK agree. The code
// is cargo-apk's (1 << 24 | major << 16 | minor << 8 | patch), so an APK built here installs
// over one built before.
def cargoVersion = (file('Cargo.toml').text =~ /(?m)^version = "(\d+)\.(\d+)\.(\d+)"/)[0]
def (major, minor, patch) = [cargoVersion[1], cargoVersion[2], cargoVersion[3]].collect { it as int }

layout.buildDirectory = file('../../target/gradle/vault-mobile-android')

// The release key (make-release-key.ps1), which build.ps1 hands over through the environment
// when it is there; without it, the Android debug key.
def releaseStore = System.getenv('VAULT_SIGNING_STORE')

android {
    namespace 'org.passwordvault.phone'
    compileSdk 35

    defaultConfig {
        applicationId 'org.passwordvault.phone'
        // Android 12: other apps' overlays hidden over the app (Shield.java), taps through
        // another app's window blocked by the system, and the task hijacking that only a
        // system update stops (StrandHogg 2) fixed in every version it installs on. Also the
        // native library's API level (build.ps1, check-library.ps1, release.yml).
        minSdk 31
        targetSdk 35
        versionCode((1 << 24) | (major << 16) | (minor << 8) | patch)
        versionName "${major}.${minor}.${patch}"
    }

    sourceSets {
        main {
            manifest.srcFile 'AndroidManifest.xml'
            java.srcDirs = ['java']
            res.srcDirs = ['res']
            jniLibs.srcDirs = ['../../target/android-libs']
        }
    }

    // Signed with the release key when build.ps1 found one: the only key updates are taken
    // from. Otherwise with the Android debug key (~/.android/debug.keystore, made by build.ps1
    // if missing): fine for trying it, never for publishing it.
    signingConfigs {
        trial {
            storeFile file("${System.getProperty('user.home')}/.android/debug.keystore")
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
        if (releaseStore) {
            vault {
                storeFile file(releaseStore)
                storeType 'pkcs12'
                storePassword System.getenv('VAULT_SIGNING_PASSWORD')
                keyAlias 'vault'
                keyPassword System.getenv('VAULT_SIGNING_PASSWORD')
            }
        }
    }

    buildTypes {
        release {
            signingConfig releaseStore ? signingConfigs.vault : signingConfigs.trial
            minifyEnabled false
        }
    }

    // The Rust library is compressed in the APK (about half its size), as cargo-apk did: an
    // APK to send and install is a third of the size. Android unpacks it once at install.
    packaging {
        jniLibs {
            useLegacyPackaging true
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    lint {
        // Lint would fetch its own checks from the network; the build stays offline.
        checkReleaseBuilds false
    }
}

dependencies {
    // Google's QR code scanner, run by Play services: it shows its own camera screen and hands
    // back only the code's text, so the app needs no camera permission.
    implementation 'com.google.android.gms:play-services-code-scanner:16.1.0'
    // Android's Credential Manager, provider side: the entries and answers of passkeys in the
    // layout the system's account picker reads (VaultCredentialService, PasskeyActivity).
    implementation 'androidx.credentials:credentials:1.5.0'
}
