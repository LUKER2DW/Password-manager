[package]
name = "vault-mobile"
version = "0.0.0"
description = "Phone app (Android first) built with Slint: the screens and their controller"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "vault_mobile"
path = "src/lib.rs"

# The app in a phone-sized window, for work on a computer.
[[bin]]
name = "vault-mobile"
path = "src/main.rs"

# Renders every screen off-screen (software renderer) to PNGs for design review:
# `cargo run -p vault-mobile --example phone_screens`
[[example]]
name = "phone_screens"

# `deny` instead of the workspace's `forbid`: Slint's generated code opts into `unsafe` with
# `#[allow]`, and the headless test sets an environment variable (one `unsafe` block).
[lints.rust]
unsafe_code = "deny"
missing_debug_implementations = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }

[dependencies]
vault-core = { path = "../../crates/core" }
# The phone's own settings file.
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
# Fingerprint of the vault file, to notice changes made outside the app.
sha2 = "0.11"
slint = "1.18"
# Clocks that also work in a browser (the web preview); std's own elsewhere.
web-time = "1.1"
zeroize = "1.9"

# The system: files, credential store, clipboard, device state. In a browser a stand-in
# takes its place (src/platform/web.rs).
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
vault-platform = { path = "../../crates/platform" }
# Sync: the invite line a computer shows.
vault-sync-wire = { path = "../../crates/sync-wire" }
# Settings → Import and export: another manager's export (no browser stores on a phone).
vault-import = { path = "../../crates/import", default-features = false }

[target.'cfg(target_arch = "wasm32")'.dependencies]
anyhow = "1"

# The computer's file dialog, for the phone-sized window only; Android uses its own picker.
[target.'cfg(not(any(target_os = "android", target_arch = "wasm32")))'.dependencies]
rfd = "0.18"

[build-dependencies]
slint-build = "1.18"

[dev-dependencies]
i-slint-backend-testing = "1.18"
image = { version = "0.25", default-features = false, features = ["png"] }
tempfile = "3.27"
# Phone sync against a real server on a local port.
tokio = { version = "1", features = ["rt-multi-thread", "net", "sync"] }
vault-server = { path = "../server" }
