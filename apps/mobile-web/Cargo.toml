[package]
name = "vault-mobile-web"
version = "0.0.0"
description = "The phone app in a browser page (WebAssembly), with a demo vault, to try it on a computer"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

# Built only for the browser: `apps/mobile-web/build.ps1`. On other targets the library is
# empty.
[lib]
crate-type = ["cdylib", "rlib"]

[lints]
workspace = true

[target.'cfg(target_arch = "wasm32")'.dependencies]
vault-core = { path = "../../crates/core" }
vault-mobile = { path = "../mobile" }
slint = "1.18"
wasm-bindgen = "=0.2.130"
# Older crates in the tree draw randomness through getrandom 0.2: from the browser too.
getrandom02 = { package = "getrandom", version = "0.2", features = ["js"] }
