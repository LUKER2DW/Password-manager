[package]
name = "vault-desktop"
version = "0.4.7"
description = "Desktop app (Windows first, Linux later) built with Slint"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "vault_desktop"
path = "src/lib.rs"

[[bin]]
name = "vault-desktop"
path = "src/main.rs"

# Renders every screen off-screen (software renderer) to PNGs for design review:
# `cargo run -p vault-desktop --example screenshots`
[[example]]
name = "screenshots"

# `deny` instead of the workspace's `forbid`: the headless test sets an environment variable,
# which needs one `unsafe` block (with `#[allow(unsafe_code)]` and a `// SAFETY:` comment).
[lints.rust]
unsafe_code = "deny"
missing_debug_implementations = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }

[dependencies]
vault-core = { path = "../../crates/core" }
vault-platform = { path = "../../crates/platform" }
vault-import = { path = "../../crates/import" }
vault-browser = { path = "../../crates/browser" }
# The Slint screens, compiled apart (see its lib.rs).
vault-desktop-ui = { path = "ui" }
anyhow = "1"
# The tray icon and the screenshots' pictures.
image = { version = "0.25", default-features = false, features = ["png", "ico", "jpeg", "gif", "bmp", "webp"] }
postcard = { version = "1.1", default-features = false, features = ["use-std"] }
raw-window-handle = "0.6"
# Native open/save dialogs (kit PDF, import, export).
rfd = "0.18"
serde = { version = "1.0", features = ["derive"] }
# What the browser extension asks is read for its kind, and answers get the settings it follows.
serde_json = "1.0"
# Fingerprint of the vault file, to notice changes made outside this window.
sha2 = "0.11"
ureq = "3.5"
# Sync: the invite another device joins with, and its QR code.
vault-sync-wire = { path = "../../crates/sync-wire" }
qrcode = { version = "0.14", default-features = false }
# The icon in the notification area (tray mode).
tray-icon = { version = "0.26", default-features = false }
slint = { version = "1.18", features = ["raw-window-handle-06", "unstable-winit-030"] }
zeroize = "1.9"

[build-dependencies]
# The app's icon in the .exe (Windows resource).
embed-resource = "3"
# The version in the browser extension's manifest.json, whose files are built into the app.
serde_json = "1.0"

[dev-dependencies]
hmac = "0.13"
i-slint-backend-testing = "1.18"
tempfile = "3.27"
# The memory test (tests/memory.rs): the keys it looks for, and many patterns searched at once
# in another process's memory.
vault-core = { path = "../../crates/core", features = ["memory-test"] }
aho-corasick = "1.1"

# The memory test reads another process's memory.
[target.'cfg(windows)'.dev-dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_Memory",
    "Win32_System_Threading",
] }
