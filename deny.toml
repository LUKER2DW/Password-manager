# cargo-deny (https://github.com/EmbarkStudios/cargo-deny): `cargo deny check advisories`,
# run by CI on every push and once a day. Every advisory fails the check: none is ignored.
# If one ever has to be, list it under `ignore` with the reason it can't be reached here, and
# look at it again at the crate's next release.

[advisories]
ignore = []
