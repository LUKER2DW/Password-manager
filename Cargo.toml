[workspace]
resolver = "3"
members = [
    # Libraries
    "crates/core",
    "crates/platform",
    "crates/import",
    "crates/browser",
    "crates/sync-wire",
    # Apps
    "apps/cli",
    "apps/desktop",
    "apps/desktop/ui",
    "apps/mobile",
    "apps/mobile-android",
    "apps/mobile-web",
    "apps/server",
]

[workspace.package]
edition = "2024"
rust-version = "1.85"
license = "GPL-3.0-or-later"
publish = false

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

# `cargo run` (debug) should still feel like the real app: every dependency (Slint's renderer,
# the crypto crates, Argon2) is optimized; only our own crates keep fast-compiling debug code.
[profile.dev.package."*"]
opt-level = 2
# No debug info for dependencies, and only line numbers for our own crates (below): the
# build folder stays several times smaller, and backtraces still name file and line.
debug = false

[profile.dev]
debug = "line-tables-only"
# No incremental cache: it grows by gigabytes per session and is never cleaned up; a rebuild
# of our own crates after a change takes a little longer instead.
incremental = false

# The vault itself is small and its serialization code is generic (compiled here, not in the
# dependencies): optimized, lists and saves stay quick in debug runs too.
[profile.dev.package.vault-core]
opt-level = 2

[profile.dev.package.argon2]
opt-level = 3

[profile.dev.package.blake2]
opt-level = 3

# Release: one codegen unit and thin LTO make a smaller, faster binary.
[profile.release]
codegen-units = 1
lto = "thin"

# For trying a build (the APK, the desktop app): optimized as release, but compiled in parallel,
# without LTO and incrementally, so a rebuild after a change takes a fraction of the time.
# `cargo build --profile fast` (output in target/fast/); a build to hand out uses release.
[profile.fast]
inherits = "release"
codegen-units = 16
lto = false
incremental = true
