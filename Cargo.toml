[workspace]
resolver = "3"
members = ["crates/core", "crates/platform", "crates/import", "crates/cli", "crates/desktop"]
# Prototypes are standalone experiments with their own lockfiles.
exclude = ["prototypes"]

[workspace.package]
edition = "2024"
rust-version = "1.85"
license = "GPL-3.0-or-later"
publish = false

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

# `cargo run` (debug) should still feel like the real app: every dependency (Slint's renderer,
# the crypto crates, Argon2) is optimized; only our own crates keep fast-compiling debug code.
[profile.dev.package."*"]
opt-level = 2

[profile.dev.package.argon2]
opt-level = 3

[profile.dev.package.blake2]
opt-level = 3

# Release: one codegen unit and thin LTO make a smaller, faster binary.
[profile.release]
codegen-units = 1
lto = "thin"
