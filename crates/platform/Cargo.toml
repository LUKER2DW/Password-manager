[package]
name = "vault-platform"
version = "0.0.0"
description = "OS integration shared by the apps: secret store, device state, clipboard, screen capture, secure input, sync targets"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

# This crate is the one place allowed to call OS APIs through `unsafe` (each block documented).
[lints.rust]
unsafe_code = "deny"
missing_debug_implementations = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
undocumented_unsafe_blocks = "warn"

# `test-chip`: `secret_store::MemoryChip`, a stand-in for the TPM that the apps' tests and
# screenshots use, so they make no keys in the real chip.
[features]
test-chip = []

[dependencies]
vault-core = { path = "../core" }
# The browser extension's zip from a GitHub release (extension_source.rs): deflate and its
# checksum, read by a small reader of our own.
flate2 = "1.1"
crc32fast = "1.5"
anyhow = "1"
# Sync over HTTPS (own server, WebDAV).
vault-sync-wire = { path = "../sync-wire" }
base64 = "0.23"
quick-xml = "0.42"
# Sync: hearing at once when another device's copy lands in the sync folder.
notify = { version = "9", default-features = false }
ureq = { version = "3.5", default-features = false, features = ["rustls"] }
# A pinned sync server's certificate authority: its SHA-256 is checked in constant time.
sha2 = "0.11"
subtle = "2.6"
# Recovery part C kept inside a picture: the person's own photo read in any common format,
# saved as a PNG with the part in its pixels (or a landscape drawn with some randomness).
png = "0.18"
image = { version = "0.25", default-features = false, features = ["png", "ico", "jpeg", "gif", "bmp", "webp"] }
# Website icons (opt-in, website_icons.rs): SVG icons drawn in pure Rust (the version Slint
# uses), and the cache's bytes.
resvg = { version = "0.49", default-features = false }
postcard = { version = "1.1", default-features = false, features = ["use-std"] }
# The emergency kit's QR codes (each recovery part and the Secret Key, for the phone's
# camera), drawn as squares in the PDF.
qrcode = { version = "0.14", default-features = false }
# The kit's saved PDFs protected by a password: the PDF standard security handler, revision 6
# (AES-256-CBC, and AES-128-CBC in its password hash; CRYPTO.md §3.10). The versions the
# importer already uses.
aes = "0.9.2"
cbc = { version = "0.2.1", features = ["zeroize"] }
getrandom = "0.4"
dirs = "7"
raw-window-handle = "0.6"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
zeroize = "1.9"
# The OS credential store's entries (each OS's store under it: `keyring` below on computers,
# the Android Keystore's on a phone).
keyring-core = "1"

# The clipboard: arboard on computers; on Android the system's ClipboardManager over JNI.
[target.'cfg(not(target_os = "android"))'.dependencies]
arboard = "3.7"
# The OS credential store (Windows Credential Manager, macOS Keychain, Secret Service).
keyring = "4"

# On Android: the clipboard over JNI, and the credential store as SharedPreferences
# encrypted with a key in the Android Keystore.
[target.'cfg(target_os = "android")'.dependencies]
android-native-keyring-store = "1"
jni = "0.21"
ndk-context = "0.1"

# The time since the device started (unlock attempts, device.rs): CLOCK_BOOTTIME.
[target.'cfg(any(target_os = "android", target_os = "linux"))'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Globalization",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Security_Cryptography",
    "Win32_Storage_FileSystem",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_ErrorReporting",
    "Win32_System_IO",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_Pipes",
    "Win32_System_Power",
    "Win32_System_ProcessStatus",
    "Win32_System_Registry",
    "Win32_System_SystemInformation",
    "Win32_System_RemoteDesktop",
    "Win32_System_StationsAndDesktops",
    "Win32_System_Threading",
    "Win32_System_Time",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_Ime",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }
# Windows Hello (WinRT KeyCredentialManager: TPM-backed key, user verification by the OS).
windows = { version = "0.62", features = [
    "Foundation",
    "Security_Credentials",
    "Security_Cryptography",
    "Storage_Streams",
] }

[dev-dependencies]
tempfile = "3.27"
# Release manifests signed with test keys (updates.rs's tests).
vault-sync-wire = { path = "../sync-wire", features = ["test-signing"] }
# A small WebDAV server for the WebDAV target's end-to-end test.
axum = { version = "0.8", default-features = false, features = ["http1", "tokio"] }
tokio = { version = "1", features = ["rt-multi-thread", "net"] }
