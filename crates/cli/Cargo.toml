[package]
name = "vault-cli"
version = "0.0.0"
description = "Command-line client for the password manager"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "vault"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
vault-core = { path = "../core" }
vault-import = { path = "../import" }
anyhow = "1"
arboard = "3.7"
clap = { version = "4.6", features = ["derive", "env"] }
dirs = "7"
keyring = "4"
rpassword = "7.5"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
zeroize = "1.9"

[dev-dependencies]
tempfile = "3.27"
