[package]
name = "vault-cli"
version = "0.0.0"
description = "Command-line client for the password manager"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "vault"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
vault-core = { path = "../core" }
vault-import = { path = "../import" }
vault-platform = { path = "../platform" }
anyhow = "1"
clap = { version = "4.6", features = ["derive", "env"] }
rpassword = "7.5"
zeroize = "1.9"

[dev-dependencies]
tempfile = "3.27"
