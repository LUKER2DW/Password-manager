[package]
name = "vault-mobile"
version = "0.0.0"
description = "Phone app (Android first) built with Slint: the screens and their controller"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "vault_mobile"
path = "src/lib.rs"

# The app in a phone-sized window, for work on a computer.
[[bin]]
name = "vault-mobile"
path = "src/main.rs"

# Renders every screen off-screen (software renderer) to PNGs for design review:
# `cargo run -p vault-mobile --example phone_screens`
[[example]]
name = "phone_screens"

# `deny` instead of the workspace's `forbid`: Slint's generated code opts into `unsafe` with
# `#[allow]`, and the headless test sets an environment variable (one `unsafe` block).
[lints.rust]
unsafe_code = "deny"
missing_debug_implementations = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }

[dependencies]
vault-core = { path = "../core" }
vault-platform = { path = "../platform" }
# Fingerprint of the vault file, to notice changes made outside the app.
sha2 = "0.11"
slint = "1.18"
zeroize = "1.9"

[build-dependencies]
slint-build = "1.18"

[dev-dependencies]
i-slint-backend-testing = "1.18"
image = { version = "0.25", default-features = false, features = ["png"] }
tempfile = "3.27"
