[package]
name = "vault-mobile-android"
version = "0.0.0"
description = "The phone app as an Android app (the native library an APK loads)"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

# Built only for Android: `crates/mobile-android/build.ps1`. On other targets the library is
# empty.
[lib]
crate-type = ["cdylib"]

# `deny` instead of `forbid`: the entry point the activity calls must be `no_mangle`.
[lints.rust]
unsafe_code = "deny"
missing_debug_implementations = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }

[target.'cfg(target_os = "android")'.dependencies]
vault-mobile = { path = "../mobile" }
slint = { version = "1.18", features = ["backend-android-activity-06"] }

# For cargo-apk: the APK's identity, what it may do, which phones it runs on.
[package.metadata.android]
package = "org.passwordvault.phone"
build_targets = ["aarch64-linux-android", "x86_64-linux-android"]
# Sync with the person's own server or WebDAV folder.
uses_permission = [{ name = "android.permission.INTERNET" }]

[package.metadata.android.sdk]
min_sdk_version = 28
target_sdk_version = 35

[package.metadata.android.application]
label = "Vault"
# Plain http is let through by Android only so a Tailscale address (100.x.y.z, encrypted by
# WireGuard) works; the app itself refuses http:// to anywhere else (sync/http.rs).
uses_cleartext_traffic = true

[package.metadata.android.application.activity]
config_changes = "orientation|screenSize|keyboardHidden|keyboard|uiMode|density"
launch_mode = "singleTask"
orientation = "portrait"
