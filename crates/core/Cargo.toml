[package]
name = "vault-core"
version = "0.0.0"
description = "Cryptography, vault format and item model for the password manager"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

# `memory-test`: the keys no public call gives out, for the desktop app's memory test
# (apps/desktop/tests/memory.rs) only. Never in a program's own build.
[features]
memory-test = []

[dependencies]
argon2 = { version = "0.6", features = ["zeroize"] }
# `zeroize` features: wipe internal key state of the cipher and of HMAC (used by HKDF) on drop.
chacha20poly1305 = { version = "0.11", features = ["zeroize"] }
# The browser drop box (spec/CRYPTO.md §3.5): libsodium's sealed box (X25519, XSalsa20-Poly1305).
crypto_box = { version = "0.9", features = ["seal"] }
# SSH key items (ssh.rs): a new key is Ed25519 (the crate sync-wire already uses). A key brought
# in is read in each common form (OpenSSH's own, passphrase or not; PKCS#8; PKCS#1 for RSA;
# SEC1 for ECDSA) and kept in OpenSSH's. ssh-key reads and writes OpenSSH's form; the other
# forms are read by the key types' own crates (rsa, p256, p384) and handed to it as numbers,
# so ssh-key's own RSA and NIST features (on older releases of those crates) stay off.
ed25519-dalek = { version = "2.2", features = ["zeroize", "pkcs8", "pem"] }
ssh-key = { version = "0.6.7", default-features = false, features = ["alloc", "std", "ed25519", "ecdsa", "encryption"] }
# ssh-key's own wire format, to hand it an ECDSA scalar (the same release ssh-key uses).
ssh-encoding = { version = "0.2", default-features = false, features = ["alloc"] }
# `getrandom`: an SSH agent's RSA signature (ssh.rs `agent_sign`) is blinded with the OS randomness.
rsa = { version = "0.10", default-features = false, features = ["std", "encoding", "getrandom", "pkcs1v15"] }
p384 = { version = "0.14", default-features = false, features = ["arithmetic", "ecdsa", "pkcs8", "pem"] }
getrandom = "0.4"
hkdf = "0.13"
hmac = { version = "0.13", features = ["zeroize"] }
pbkdf2 = { version = "0.13", default-features = false }
postcard = { version = "1.1", default-features = false, features = ["use-std"] }
# Passkeys (passkey.rs): ES256, ECDSA over P-256 with SHA-256, the signature WebAuthn sites expect.
# Deterministic nonces (RFC 6979); keys come from the OS randomness (random.rs).
p256 = { version = "0.14", default-features = false, features = ["ecdsa", "pkcs8", "pem"] }
# Only for `der`: the signature is sent DER-encoded, as WebAuthn asks (no other code from it).
ecdsa = { version = "0.17", default-features = false, features = ["der"] }
scrypt = { version = "0.12.0", default-features = false }
serde = { version = "1.0", features = ["derive"] }
sha1 = { version = "0.11", features = ["zeroize"] }  # TOTP only (RFC 6238 default); never used for anything security-critical beyond HMAC
# `zeroize`: the hash state inside HMAC and HKDF is wiped too.
sha2 = { version = "0.11", features = ["zeroize"] }
subtle = "2.6"
thiserror = "2.0"
unicode-normalization = "0.1"
zeroize = { version = "1.9", features = ["derive"] }
zxcvbn = "3.1.1"
# Clocks that also work in a browser (WebAssembly); on other targets these are std's own.
web-time = "1.1"

# `parallel`: Argon2 lanes run on separate threads (faster unlock at the same attacker cost).
# Not in a browser build, which has no threads.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
argon2 = { version = "0.6", features = ["parallel"] }

# A browser build takes its randomness from the browser (crypto.getRandomValues).
[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.4", features = ["wasm_js"] }

[dev-dependencies]
# ssh.rs's tests put a passphrase on a test key (its salt from a predictable source).
rand_core = "0.6"
proptest = "1.12"
serde_json = "1.0"
tempfile = "3.27"
