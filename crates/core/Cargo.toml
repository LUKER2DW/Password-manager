[package]
name = "vault-core"
version = "0.0.0"
description = "Cryptography, vault format and item model for the password manager"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
argon2 = { version = "0.6", features = ["zeroize"] }
# `zeroize` features: wipe internal key state of the cipher and of HMAC (used by HKDF) on drop.
chacha20poly1305 = { version = "0.11", features = ["zeroize"] }
# The browser drop box (spec/CRYPTO.md §3.5): libsodium's sealed box (X25519, XSalsa20-Poly1305).
crypto_box = { version = "0.9", features = ["seal"] }
# SSH key items (ssh.rs): a new key is Ed25519 (the crate sync-wire already uses). A key brought
# in is read in each common form (OpenSSH's own, passphrase or not; PKCS#8; PKCS#1 for RSA;
# SEC1 for ECDSA) and kept in OpenSSH's, with RustCrypto's ssh-key and the key types' crates.
ed25519-dalek = { version = "2.2", features = ["zeroize", "pkcs8", "pem"] }
ssh-key = { version = "0.6.7", default-features = false, features = ["alloc", "std", "ed25519", "rsa", "p256", "p384", "encryption"] }
rsa = { version = "0.9", default-features = false, features = ["std", "pem"] }
p384 = { version = "0.13", default-features = false, features = ["ecdsa", "pkcs8", "pem"] }
getrandom = "0.4"
hkdf = "0.13"
hmac = { version = "0.13", features = ["zeroize"] }
pbkdf2 = { version = "0.13", default-features = false }
postcard = { version = "1.1", features = ["use-std"] }
# Passkeys (passkey.rs): ES256, ECDSA over P-256 with SHA-256, the signature WebAuthn sites expect.
# Deterministic nonces (RFC 6979); keys come from the OS randomness (random.rs).
p256 = { version = "0.13.2", default-features = false, features = ["ecdsa", "pkcs8", "pem"] }
# Only for `der`: the signature is sent DER-encoded, as WebAuthn asks (no other code from it).
ecdsa = { version = "0.16.9", default-features = false, features = ["der"] }
scrypt = { version = "0.12.0", default-features = false }
serde = { version = "1.0", features = ["derive"] }
sha1 = "0.11"  # TOTP only (RFC 6238 default); never used for anything security-critical beyond HMAC
sha2 = "0.11"
subtle = "2.6"
thiserror = "2.0"
unicode-normalization = "0.1"
zeroize = { version = "1.9", features = ["derive"] }
zxcvbn = "3.1.1"
# Clocks that also work in a browser (WebAssembly); on other targets these are std's own.
web-time = "1.1"

# `parallel`: Argon2 lanes run on separate threads (faster unlock at the same attacker cost).
# Not in a browser build, which has no threads.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
argon2 = { version = "0.6", features = ["parallel"] }

# A browser build takes its randomness from the browser (crypto.getRandomValues).
[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.4", features = ["wasm_js"] }

[dev-dependencies]
# ssh.rs's tests put a passphrase on a test key (its salt from a predictable source).
rand_core = "0.6"
proptest = "1.12"
serde_json = "1.0"
tempfile = "3.27"
