[package]
name = "vault-sync-wire"
version = "0.0.0"
description = "What a device and the sync server say to each other: signed requests, enrollment, JSON bodies"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
ed25519-dalek = { version = "2.2", features = ["zeroize"] }
getrandom = "0.4"
serde = { version = "1.0", features = ["derive"] }
sha2 = "0.11"
subtle = "2.6"
zeroize = "1.9"

[dev-dependencies]
serde_json = "1.0"
