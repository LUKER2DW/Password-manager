[package]
name = "vault-browser"
version = "0.0.0"
description = "Browser extension link: the messages the extension and the desktop app exchange, strict origin matching, and the native messaging host"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "vault_browser"
path = "src/lib.rs"

# Started by the browser when the extension asks; relays messages to the desktop app.
[[bin]]
name = "vault-browser-host"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
vault-core = { path = "../core" }
vault-platform = { path = "../platform" }
getrandom = "0.4"
hmac = "0.13"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.11"
# WHATWG URL parsing: origins are compared exactly as a browser computes them.
url = "2.5"
zeroize = "1.9"
