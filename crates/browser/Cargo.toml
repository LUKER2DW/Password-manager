[package]
name = "vault-browser"
version = "0.0.0"
description = "Browser extension link: the messages the extension and the desktop app exchange, strict origin matching, and the native messaging host's relay (run by the desktop app's own executable)"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "vault_browser"
path = "src/lib.rs"

[lints]
workspace = true

[dependencies]
vault-core = { path = "../core" }
vault-platform = { path = "../platform" }
# Versions as the apps write them (`x.y.z`), compared one way everywhere.
vault-sync-wire = { path = "../sync-wire" }
# The extension's requests and the app's answers are sealed with AES-256-GCM, the AEAD the
# browser's WebCrypto offers (pairing.rs, CRYPTO.md §3.9).
aes-gcm = { version = "0.11.1", default-features = false, features = ["aes", "alloc", "zeroize"] }
# Passkeys: WebAuthn's ids, challenges and answers travel as base64url.
base64 = "0.23"
getrandom = "0.4"
hkdf = "0.13"
hmac = "0.13"
# The connection key is agreed with ECDH P-256 (pairing.rs).
p256 = { version = "0.14", default-features = false, features = ["ecdh"] }
# The Public Suffix List, compiled in (no network): a `*.` entry may not cover a whole
# registry such as `*.co.uk`.
psl = "2.1"
serde = { version = "1.0", features = ["derive"] }
# `raw_value`: the request inside a sealed message is passed on as it came, never copied
# (protocol.rs `asked`).
serde_json = { version = "1.0", features = ["raw_value"] }
sha2 = "0.11"
# Lookalike sites (lookalike.rs): accents taken off names, and the script of each letter, so a
# name that mixes scripts is shown in its ASCII form. Both are already in the workspace (core,
# the UI's text shaping): nothing new is downloaded, and no list of sites either.
unicode-normalization = "0.1"
unicode-script = "0.5"
# WHATWG URL parsing: origins are compared exactly as a browser computes them.
url = "2.5"
zeroize = "1.9"
