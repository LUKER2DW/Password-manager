[package]
name = "vault-import"
version = "0.0.0"
description = "Import from and export to other password managers (JSON, CSV, KDBX)"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
vault-core = { path = "../core" }
csv = "1.4"
keepass = { version = "0.17", default-features = false }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
sha2 = "0.11"
zeroize = "1.9"
aes = "0.9.2"
aes-gcm = "0.11.1"
cbc = "0.2.1"
des = "0.9.0"
pbkdf2 = "0.13.0"
sha1 = "0.11.0"
base64 = "0.23.1"
# Browser stores (opened from bytes in memory; SQLite is compiled in).
rusqlite = { version = "0.40.2", features = ["bundled", "serialize"] }

[dev-dependencies]
# Used only to build KDBX test databases in memory.
keepass = { version = "0.17", default-features = false, features = ["save_kdbx4"] }
tempfile = "3.27.0"
