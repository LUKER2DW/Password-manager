[package]
name = "vault-desktop"
version = "0.0.0"
description = "Desktop app (Windows first, Linux later) built with Slint"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "vault_desktop"
path = "src/lib.rs"

[[bin]]
name = "vault-desktop"
path = "src/main.rs"

# Renders every screen off-screen (software renderer) to PNGs for design review:
# `cargo run -p vault-desktop --example screenshots`
[[example]]
name = "screenshots"

# `deny` instead of the workspace's `forbid`: Slint's generated code opts into `unsafe` with
# `#[allow]`, which `forbid` would reject. Hand-written code here still may not use `unsafe`.
[lints.rust]
unsafe_code = "deny"
missing_debug_implementations = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }

[dependencies]
vault-core = { path = "../core" }
vault-platform = { path = "../platform" }
vault-import = { path = "../import" }
anyhow = "1"
# Website icons (opt-in): fetched directly from each site over HTTPS, decoded in pure Rust.
image = { version = "0.25", default-features = false, features = ["png", "ico", "jpeg", "gif", "bmp", "webp"] }
postcard = { version = "1.1", features = ["use-std"] }
raw-window-handle = "0.6"
# Native open/save dialogs (kit PDF, import, export).
rfd = "0.18"
serde = { version = "1.0", features = ["derive"] }
# Fingerprint of the vault file, to notice changes made outside this window.
sha2 = "0.11"
ureq = "3.5"
slint = { version = "1.18", features = ["raw-window-handle-06", "unstable-winit-030"] }
zeroize = "1.9"

[build-dependencies]
slint-build = "1.18"

[dev-dependencies]
i-slint-backend-testing = "1.18"
tempfile = "3.27"
