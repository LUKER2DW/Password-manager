[package]
name = "vault-desktop"
version = "0.0.0"
description = "Desktop app (Windows first, Linux later) built with Slint"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "vault-desktop"
path = "src/main.rs"

# `deny` instead of the workspace's `forbid`: Slint's generated code opts into `unsafe` with
# `#[allow]`, which `forbid` would reject. Hand-written code here still may not use `unsafe`.
[lints.rust]
unsafe_code = "deny"
missing_debug_implementations = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }

[dependencies]
vault-core = { path = "../core" }
vault-platform = { path = "../platform" }
anyhow = "1"
raw-window-handle = "0.6"
slint = { version = "1.18", features = ["raw-window-handle-06"] }
zeroize = "1.9"

[build-dependencies]
slint-build = "1.18"

[dev-dependencies]
i-slint-backend-testing = "1.18"
tempfile = "3.27"
